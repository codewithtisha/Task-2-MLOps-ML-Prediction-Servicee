
name: ML Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        working-directory: Phase-1-ML-Service
        run: uv sync --frozen

      - name: Lint Python files
        working-directory: Phase-1-ML-Service
        run: uvx ruff check app.py train.py tests/

      - name: Run automated tests
        working-directory: Phase-1-ML-Service
        run: uv run pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: Phase-1-ML-Service
          push: false
          tags: task2-ml-service:ci
