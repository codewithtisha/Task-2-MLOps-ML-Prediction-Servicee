# The Service gives your running API a stable network endpoint, even if Kubernetes replaces its pod.

apiVersion: v1
kind: Service
metadata:
  name: ml-prediction-service
  namespace: ml-prediction
spec:
  type: NodePort
  selector:
    app: ml-prediction-api
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30081 
      # This maps the Service's port 5001 to port 30081 on the Minikube node.
      # use for Minikube's service access command to reach it locally.
      protocol: TCP
